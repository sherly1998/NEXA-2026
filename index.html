<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PB NEXA Admin</title><style>body{margin:0;background:#f4f7fb;font-family:system-ui;color:#102a43}.wrap{max-width:680px;margin:auto;padding:16px}header{background:#102a43;color:#fff;padding:18px;border-radius:16px}h1{margin:0;font-size:25px}.card{background:#fff;margin-top:12px;padding:14px;border-radius:14px;box-shadow:0 3px 13px #102a4312}button,select,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #d9e2ec}button{background:#007c91;color:#fff;border:0;font-weight:700}button.out{background:#fff3ed;color:#c2410c}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.player,.match{border:1px solid #d9e2ec;border-radius:10px;padding:10px;margin-top:8px}.muted{font-size:12px;color:#627d98}.badge{background:#e6fffb;color:#006b78;padding:4px 7px;border-radius:7px;font-weight:bold}.hide{display:none}img{max-width:190px;border-radius:10px}.teams{font-weight:700;line-height:1.7}.notice{background:#fff4dc;padding:10px;border-radius:9px;font-size:13px}</style></head><body><div class="wrap"><header><h1>PB NEXA — Admin</h1><div id="subtitle">Memuat sesi...</div></header><div id="setup" class="card hide"><b>Konfigurasi belum diisi.</b><p>Isi <code>config.js</code> dengan URL dan anon key Supabase, lalu buka kembali halaman ini.</p></div><main id="app" class="hide"><div class="card"><div class="row"><select id="courts"><option value="3">3 lapangan</option><option value="4">4 lapangan</option></select><button class="grow" onclick="makeSession()">Sesi latihan baru</button></div><div id="qr" class="hide"><p><b>QR absensi sesi ini</b></p><img id="qrImage"><p class="muted" id="checkinUrl"></p></div></div><div class="card"><div class="row"><h3 class="grow">Pemain hadir</h3><button onclick="makeMatches()">⚡ Buat match</button></div><div class="notice">Prioritas: grade sama terlebih dahulu. Campur hanya maksimal 1 tingkat bila diperlukan.</div><div id="people"></div></div><div class="card"><h3>Lapangan aktif</h3><div id="matches"></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb,session,att=[];const q=s=>document.querySelector(s),grade=['A','B+','B','C'];const ok=()=>NEXA_CONFIG.supabaseUrl.startsWith('http');setInterval(()=>{if(typeof renderReports==='function')renderReports()},4000);
async function init(){if(!ok()){q('#setup').classList.remove('hide');return}sb=supabase.createClient(NEXA_CONFIG.supabaseUrl,NEXA_CONFIG.supabaseAnonKey);q('#app').classList.remove('hide');let{data}=await sb.from('sessions').select('*').eq('active',true).order('created_at',{ascending:false}).limit(1);session=data?.[0];if(!session)await makeSession();else await load();sb.channel('nexa-admin').on('postgres_changes',{event:'*',schema:'public',table:'attendance'},load).on('postgres_changes',{event:'*',schema:'public',table:'matches'},load).subscribe()}
async function makeSession(){if(session)await sb.from('sessions').update({active:false}).eq('id',session.id);let{data,error}=await sb.from('sessions').insert({courts:+q('#courts').value}).select().single();if(error)return alert(error.message);session=data;await load()}
async function load(){if(!session)return;let [{data:a},{data:m}]=await Promise.all([sb.from('attendance').select('*,players(*)').eq('session_id',session.id).order('checked_in_at'),sb.from('matches').select('*').eq('session_id',session.id).order('court')]);att=a||[];q('#courts').value=session.courts;q('#subtitle').textContent='Sesi aktif · '+new Date(session.created_at).toLocaleDateString('id-ID');let url=new URL('checkin.html?session='+session.id,location.href).href;q('#qr').classList.remove('hide');q('#qrImage').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);q('#checkinUrl').textContent=url;q('#people').innerHTML=att.length?att.map(x=>`<div class="player row"><span class="badge">${x.players.grade}</span><div class="muted">Datang ${new Date(x.checked_in_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} · ${x.status}</div><div class="grow"><b>${x.players.name}</b></div>${x.status==='home'?`<button onclick="status('${x.id}','active')">Datang lagi</button>`:`<button class="out" onclick="status('${x.id}','home')">Pulang</button>`}</div>`).join(''):'<p class="muted">Menunggu pemain scan QR.</p>';q('#matches').innerHTML=(m||[]).length?m.map(x=>`<div class="match"><b>Lapangan ${x.court}</b><div class="teams">${x.teams[0].map(p=>p.name).join(' + ')}<br>vs<br>${x.teams[1].map(p=>p.name).join(' + ')}</div>${x.status==='playing'?`<button onclick="finish('${x.id}')">Selesai / isi skor</button>`:`<div class="muted">${x.score_a} — ${x.score_b} · ${x.balls} bola per pemain</div>`}</div>`).join(''):'<p class="muted">Belum ada match aktif.</p>'}
async function renderReports(){if(!sb)return;let box=q('#reportCard');if(!box){box=document.createElement('div');box.id='reportCard';box.className='card';box.innerHTML='<h3>Laporan pemain</h3><p class="muted">Grade berubah otomatis setelah hasil match disimpan. Angka bola adalah total bola per pemain.</p><div id="reports"></div>';q('#matches').parentElement.insertAdjacentElement('afterend',box)}let{data:p}=await sb.from('players').select('*').order('name');q('#reports').innerHTML=(p||[]).length?p.map(x=>`<div class="player row"><span class="badge">${x.grade}</span><div class="grow"><b>${x.name}</b><div class="muted">${x.games} game · ${x.wins} menang · rating ${x.rating||0}${x.match_request?' · Request: '+x.match_request:''}</div></div><b>${x.balls} 🏸</b></div>`).join(''):'<p class="muted">Belum ada data pemain.</p>'}
async function status(id,v){await sb.from('attendance').update({status:v,left_at:v==='home'?new Date().toISOString():null}).eq('id',id);load()}
function gi(p){return grade.indexOf(p.players.grade)}function pr(p){return Date.now()-new Date(p.checked_in_at)-((p.players.games||0)*900000)}function pick(pool){let s=[...pool].sort((a,b)=>pr(b)-pr(a)),seed=s[0],same=s.filter(p=>p.players.grade===seed.players.grade);return(same.length>=4?same:s.filter(p=>Math.abs(gi(p)-gi(seed))<=1)).slice(0,4)}function teams(f){let c=[[0,1,2,3],[0,2,1,3],[0,3,1,2]],best=c[0],d=99;c.forEach(z=>{let v=Math.abs(gi(f[z[0]])+gi(f[z[1]])-gi(f[z[2]])-gi(f[z[3]]));if(v<d){d=v;best=z}});return [[f[best[0]],f[best[1]]],[f[best[2]],f[best[3]]]]}
async function makeMatches(){let playing=att.filter(x=>x.status==='playing').length/4,slots=session.courts-playing,pool=att.filter(x=>x.status==='active'),rows=[];while(slots--&&pool.length>=4){let f=pick(pool);if(f.length<4)break;let t=teams(f).map(z=>z.map(x=>({id:x.players.id,name:x.players.name,grade:x.players.grade})));rows.push({session_id:session.id,court:playing+rows.length+1,teams:t});pool=pool.filter(x=>!f.includes(x));await Promise.all(f.map(x=>sb.from('attendance').update({status:'playing'}).eq('id',x.id)))}if(rows.length)await sb.from('matches').insert(rows);else alert('Belum ada 4 pemain yang cocok.');load()}
async function finish(id){let a=+prompt('Skor Tim 1 (sampai 30):'),b=+prompt('Skor Tim 2 (sampai 30):'),balls=+prompt('Bola dipakai per pemain:');if(a===b||!Number.isFinite(a)||!Number.isFinite(b)||!Number.isFinite(balls))return;let{data:m}=await sb.from('matches').select('*').eq('id',id).single(),win=a>b?0:1;for(let [i,t] of m.teams.entries())for(let p of t){let x=att.find(z=>z.players.id===p.id),pl=x.players,own=m.teams[i],opp=m.teams[1-i],ownAvg=own.reduce((s,z)=>s+grade.indexOf(z.grade),0)/2,oppAvg=opp.reduce((s,z)=>s+grade.indexOf(z.grade),0)/2,facingStronger=oppAvg<ownAvg,delta=i===win?(facingStronger?2:1):(facingStronger?-1:-2),rating=(pl.rating||0)+delta,ix=grade.indexOf(pl.grade),newGrade=pl.grade;if(rating>=6&&ix>0){newGrade=grade[ix-1];rating=0}if(rating<=-6&&ix<3){newGrade=grade[ix+1];rating=0}await sb.from('players').update({games:pl.games+1,wins:pl.wins+(i===win?1:0),balls:pl.balls+balls,grade:newGrade,rating}).eq('id',p.id);await sb.from('attendance').update({status:'active'}).eq('id',x.id)}await sb.from('matches').update({status:'done',score_a:a,score_b:b,balls,ended_at:new Date().toISOString()}).eq('id',id);load()}
init();</script></body></html>
