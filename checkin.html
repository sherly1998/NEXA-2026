<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PB NEXA Check-in</title><style>body{margin:0;background:#f4f7fb;font:16px system-ui;color:#102a43}.box{max-width:440px;margin:40px auto;padding:18px}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 18px #102a4314}h1{margin-top:0}input,select,button{font:inherit;width:100%;padding:12px;margin-top:9px;border-radius:10px;border:1px solid #d9e2ec}button{background:#007c91;color:white;border:0;font-weight:bold}.muted{font-size:13px;color:#627d98}.hide{display:none}.request{background:#f5f3ff;margin-top:15px;padding:12px;border-radius:10px;font-size:13px}</style></head><body><div class="box"><div class="card"><h1>🏸 PB NEXA</h1><p id="info">Memuat sesi absensi...</p><div id="form" class="hide"><label>Pilih nama Anda</label><select id="existing"><option value="">— Pemain baru —</option></select><label>Atau isi nama baru</label><input id="name" placeholder="Nama pemain"><label>Grade awal (pemain baru)</label><select id="grade"><option>A</option><option>B+</option><option>B</option><option selected>C</option></select><div class="request"><b>Request match (opsional)</b><br><span class="muted">Request dijalankan hanya bila grade dan rotasi tetap seimbang.</span><select id="requestType"><option value="">Tidak ada request</option><option value="Partner">Minta partner</option><option value="Lawan">Minta lawan</option></select><select id="requestTarget"><option value="">Pilih pemain</option></select></div><button onclick="checkin()">Saya hadir</button><p class="muted">Grade pemain lama memakai grade terakhir dari sistem.</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>let sb,sessionId,players=[];const q=s=>document.querySelector(s);async function init(){sessionId=new URLSearchParams(location.search).get('session');if(!sessionId)return q('#info').textContent='QR sesi tidak valid.';if(!NEXA_CONFIG.supabaseUrl.startsWith('http'))return q('#info').textContent='Sistem belum dikonfigurasi.';sb=supabase.createClient(NEXA_CONFIG.supabaseUrl,NEXA_CONFIG.supabaseAnonKey);let[{data:s,error:se},{data:p,error:pe}]=await Promise.all([sb.from('sessions').select('*').eq('id',sessionId).single(),sb.from('players').select('*').order('name')]);if(se||pe)return q('#info').textContent='Koneksi database gagal. Coba refresh atau hubungi admin.';if(!s||!s.active)return q('#info').textContent='Sesi ini sudah ditutup.';players=p||[];q('#info').textContent='Sesi aktif · silakan absen';q('#existing').innerHTML+=players.map(x=>`<option value="${x.id}">${x.name} · ${x.grade}</option>`).join('');q('#requestTarget').innerHTML+=players.map(x=>`<option value="${x.id}">${x.name} · ${x.grade}</option>`).join('');q('#form').classList.remove('hide')}async function checkin(){let id=q('#existing').value,name=q('#name').value.trim(),target=players.find(x=>x.id===q('#requestTarget').value),request=q('#requestType').value&&target?q('#requestType').value+': '+target.name:null;if(!id&&!name)return alert('Pilih nama atau isi nama baru.');if(!id){let{data,error}=await sb.from('players').insert({name,grade:q('#grade').value,match_request:request}).select().single();if(error)return alert(error.message);id=data.id}else{let{error}=await sb.from('players').update({match_request:request}).eq('id',id);if(error)return alert(error.message)}let{error}=await sb.from('attendance').upsert({session_id:sessionId,player_id:id,status:'active',checked_in_at:new Date().toISOString(),left_at:null},{onConflict:'session_id,player_id'});if(error)return alert(error.message);q('#form').innerHTML='<h2>✓ Anda sudah hadir</h2><p>Nama Anda sudah masuk ke rotasi admin.</p>'}init();</script></body></html>
