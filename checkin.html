<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PB NEXA Check-in</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef4f8;color:#102a43;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    .box{max-width:520px;margin:0 auto;padding:18px}
    .card{background:#fff;border:1px solid #d9e2ec;border-radius:12px;padding:18px;box-shadow:0 8px 22px #102a4312}
    h1{margin:0 0 8px;font-size:26px}
    label{display:block;margin-top:13px;font-weight:700}
    input,select,button{width:100%;min-height:46px;margin-top:7px;border-radius:8px;border:1px solid #cbd5e1;padding:10px 12px;font:inherit;background:#fff}
    button{border:0;background:#007c91;color:#fff;font-weight:800}
    button:disabled{background:#9fb3c8}
    .muted{color:#627d98;font-size:13px}
    .panel{margin-top:14px;padding:12px;border-radius:10px;background:#f5f3ff;border:1px solid #ddd6fe}
    .hide{display:none}
    .ok{padding:14px;border-radius:10px;background:#ecfdf5;color:#065f46;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <div class="card">
      <h1>PB NEXA</h1>
      <p id="info" class="muted">Memuat sesi absensi...</p>

      <form id="form" class="hide">
        <label for="existing">Pilih nama Anda</label>
        <select id="existing">
          <option value="">-- Pemain baru --</option>
        </select>

        <label for="name">Atau isi nama baru</label>
        <input id="name" autocomplete="name" placeholder="Nama pemain">

        <label for="grade">Grade awal untuk pemain baru</label>
        <select id="grade">
          <option>A</option>
          <option>B+</option>
          <option>B</option>
          <option selected>C</option>
        </select>

        <div class="panel">
          <b>Request match opsional</b>
          <p class="muted">Request tetap mengikuti rotasi dan keseimbangan grade.</p>

          <label for="partner">Minta partner</label>
          <select id="partner">
            <option value="">Tidak ada</option>
          </select>

          <label for="opponent1">Minta lawan 1</label>
          <select id="opponent1">
            <option value="">Tidak ada</option>
          </select>

          <label for="opponent2">Minta lawan 2</label>
          <select id="opponent2">
            <option value="">Tidak ada</option>
          </select>
        </div>

        <button id="submit" type="submit">Saya hadir</button>
        <p class="muted">Grade pemain lama memakai grade terakhir dari sistem admin.</p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    let sb;
    let sessionId;
    let players = [];

    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    function fillPlayerSelect(selector) {
      const selected = $(selector).value;
      $(selector).innerHTML = '<option value="">Tidak ada</option>' + players
        .map((player) => `<option value="${player.id}">${esc(player.name)} - ${esc(player.grade)}</option>`)
        .join('');
      $(selector).value = selected;
    }

    function currentPlayerId() {
      return $('#existing').value || '';
    }

    function cleanRequestSelects() {
      const selfId = currentPlayerId();
      const used = new Set([selfId].filter(Boolean));
      ['#partner', '#opponent1', '#opponent2'].forEach((selector) => {
        const select = $(selector);
        if (select.value && used.has(select.value)) select.value = '';
        if (select.value) used.add(select.value);
      });
    }

    async function init() {
      sessionId = new URLSearchParams(location.search).get('session');
      if (!sessionId) {
        $('#info').textContent = 'QR sesi tidak valid. Minta QR baru dari admin.';
        return;
      }
      if (!window.NEXA_CONFIG || !NEXA_CONFIG.supabaseUrl.startsWith('http')) {
        $('#info').textContent = 'Sistem belum dikonfigurasi.';
        return;
      }

      sb = supabase.createClient(NEXA_CONFIG.supabaseUrl, NEXA_CONFIG.supabaseAnonKey);
      const [{ data: session, error: sessionError }, { data: playerRows, error: playerError }] = await Promise.all([
        sb.from('sessions').select('*').eq('id', sessionId).single(),
        sb.from('players').select('*').order('name')
      ]);

      if (sessionError || playerError) {
        $('#info').textContent = 'Koneksi database gagal. Coba refresh atau hubungi admin.';
        return;
      }
      if (!session || !session.active) {
        $('#info').textContent = 'Sesi ini sudah ditutup.';
        return;
      }

      players = (playerRows || []).filter((player) => player.archived !== true);
      $('#existing').innerHTML += players
        .map((player) => `<option value="${player.id}">${esc(player.name)} - ${esc(player.grade)}</option>`)
        .join('');
      fillPlayerSelect('#partner');
      fillPlayerSelect('#opponent1');
      fillPlayerSelect('#opponent2');

      $('#info').textContent = 'Sesi aktif. Silakan absen.';
      $('#form').classList.remove('hide');
    }

    async function checkIn(event) {
      event.preventDefault();
      cleanRequestSelects();

      const existingId = $('#existing').value;
      const name = $('#name').value.trim();
      const partnerRequest = $('#partner').value || null;
      const opponents = ['#opponent1', '#opponent2']
        .map((selector) => $(selector).value)
        .filter(Boolean);

      if (!existingId && !name) {
        alert('Pilih nama atau isi nama baru.');
        return;
      }

      $('#submit').disabled = true;
      $('#submit').textContent = 'Menyimpan...';

      let playerId = existingId;
      if (!playerId) {
        const { data, error } = await sb.from('players').insert({
          name,
          grade: $('#grade').value,
          partner_request: partnerRequest,
          opponent_request: JSON.stringify(opponents)
        }).select('id').single();
        if (error) {
          alert(error.message);
          $('#submit').disabled = false;
          $('#submit').textContent = 'Saya hadir';
          return;
        }
        playerId = data.id;
      } else {
        const { error } = await sb.from('players').update({
          partner_request: partnerRequest,
          opponent_request: JSON.stringify(opponents)
        }).eq('id', playerId);
        if (error) {
          alert(error.message);
          $('#submit').disabled = false;
          $('#submit').textContent = 'Saya hadir';
          return;
        }
      }

      const now = new Date().toISOString();
      const { error: attendanceError } = await sb.from('attendance').upsert({
        session_id: sessionId,
        player_id: playerId,
        status: 'active',
        checked_in_at: now,
        wait_started_at: now,
        left_at: null
      }, { onConflict: 'session_id,player_id' });

      if (attendanceError) {
        alert(attendanceError.message);
        $('#submit').disabled = false;
        $('#submit').textContent = 'Saya hadir';
        return;
      }

      $('#form').innerHTML = '<div class="ok">Anda sudah hadir. Nama Anda sudah masuk ke rotasi admin.</div>';
    }

    $('#existing').addEventListener('change', () => {
      $('#grade').disabled = !!$('#existing').value;
      cleanRequestSelects();
    });
    ['#partner', '#opponent1', '#opponent2'].forEach((selector) => {
      $(selector).addEventListener('change', cleanRequestSelects);
    });
    $('#form').addEventListener('submit', checkIn);
    init();
  </script>
</body>
</html>
